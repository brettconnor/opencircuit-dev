name: Run Open Circuit Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: "Additional prompting to send to the Open Circuit agent"
        required: false
        type: string
        default: ""
      agent:
        description: "The Open Circuit agent slug to use"
        required: true
        type: string
      branch_name:
        description: "The base branch name to work from"
        required: false
        type: string
        default: "main"
    secrets:
      OCIRCUIT_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Call agents endpoint
        env:
          PROMPT: ${{ inputs.prompt }}
          AGENT: ${{ inputs.agent }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          REPO_URL: https://github.com/${{ github.repository }}
          OCIRCUIT_API_KEY: ${{ secrets.OCIRCUIT_API_KEY }}
        run: |
          # Use jq to properly construct JSON with safe escaping
          json_body=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg agent "$AGENT" \
            --arg branchName "$BRANCH_NAME" \
            --arg repoUrl "$REPO_URL" \
            '{prompt: $prompt, agent: $agent, branchName: $branchName, repoUrl: $repoUrl}')

          response=$(curl -f -X POST https://api.ocircuit.dev/agents \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OCIRCUIT_API_KEY" \
            -d "$json_body")
          id=$(echo $response | jq -r '.id')
          echo "//hub?type=agents/$id"
