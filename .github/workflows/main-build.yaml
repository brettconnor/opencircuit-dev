name: Main Branch Build

# Download and republish VS Code extension artifacts when code is merged to main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: "PR number to test with"
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  republish-pr-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact_name: vscode-extension-build-linux-x64
          - artifact_name: vscode-extension-build-darwin-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2 # Get the last 2 commits to find the merge commit

      - name: Get merged PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR number for the current commit using GitHub API
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Getting PR for commit: $COMMIT_SHA"

          PR_NUMBER=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
            | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find PR for commit $COMMIT_SHA"
            exit 1
          fi

          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find PR workflow run
        id: find-run
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "🔍 Getting branch name for PR #$PR_NUMBER..."

          # Get the branch name for the PR
          BRANCH_NAME=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')

          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Could not find PR #$PR_NUMBER"
            exit 1
          fi

          echo "Branch name: $BRANCH_NAME"

          # Get the latest successful workflow run for the branch
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow="pr-build-upload-vsix.yaml" \
            --branch="$BRANCH_NAME" \
            --json databaseId,status,conclusion \
            --jq ".[] | select(.status == \"completed\" and .conclusion == \"success\") | .databaseId" \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "No successful VSIX workflow run found for PR #$PR_NUMBER (branch: $BRANCH_NAME); skipping republish."
            echo "skip_republish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found successful workflow run: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "skip_republish=false" >> $GITHUB_OUTPUT

      - name: Download PR artifact
        if: steps.find-run.outputs.skip_republish != 'true'
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading $ARTIFACT_NAME artifact from run $RUN_ID..."

          artifact_id="$(gh api \
            "/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME) | .id')"
          if [[ -z "$artifact_id" ]]; then
            echo "No $ARTIFACT_NAME artifact was produced by this PR; skipping republish."
            exit 0
          fi

          # Create temporary directory for download
          mkdir -p ./temp-download

          # Download the artifact from the PR workflow run
          if ! gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" \
            --dir "./temp-download"; then
            echo "❌ Failed to download artifact $ARTIFACT_NAME from run $RUN_ID"
            exit 1
          fi

          echo "✅ Successfully downloaded artifact"

      - name: Republish as main branch artifact
        if: steps.find-run.outputs.skip_republish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ./temp-download/*
