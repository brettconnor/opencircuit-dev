name: Weekly Open Circuit Task

on:
  schedule:
    # Runs at 8/9:30 AM PST (16:30 UTC) every Monday so PR shows up at beginning of week
    - cron: "30 16 * * 1"
  workflow_dispatch: # Allows manual triggering

jobs:
  run-oc-task:
    # Only run this workflow on the canonical repository.
    if: github.repository == 'brettconnor/opencircuit-dev'
    uses: ./.github/workflows/run-ocircuit-agent.yml
    with:
      agent: continuedev/tidy-up-markdown-agent
      branch_name: main
    secrets:
      OCIRCUIT_API_KEY: ${{ secrets.OCIRCUIT_API_KEY }}
