name: CLI PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli_core: ${{ steps.profiles.outputs.cli_core }}
      vsix: ${{ steps.profiles.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect change profiles
        id: profiles
        uses: ./.github/actions/detect-change-profiles
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          enable-vsix: false

  track-rerun:
    runs-on: ubuntu-latest
    if: github.run_attempt > 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Track workflow rerun
        uses: ./.github/actions/track-rerun

  lint:
    needs: changes
    if: needs.changes.outputs.cli_core == 'true'
    runs-on: ubuntu-latest
    # Temporarily non-blocking: failing at Setup steps in CI only, unreproducible
    # locally or via the Ubuntu1 gate. See PR #67 investigation notes.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: "npm"
          cache-dependency-path: extensions/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install dependencies
        run: |
          cd extensions/cli
          npm ci --include=optional
          npm run check:install-scripts
          npm run check:dependency-policy

      - name: Run linting
        run: |
          cd extensions/cli
          npm run lint

  test:
    needs: changes
    if: needs.changes.outputs.cli_core == 'true'
    strategy:
      matrix:
        # Cross-platform CLI validation is deferred; retain the Ubuntu gate.
        os: [ubuntu-latest]
        node-version: [24.19.0]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Temporarily non-blocking: failing at Setup steps in CI only, unreproducible
    # locally or via the Ubuntu1 gate. See PR #67 investigation notes.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache CLI node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: extensions/cli/node_modules
          key: ${{ runner.os }}-node${{ matrix.node-version }}-cli-modules-${{ hashFiles('extensions/cli/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-cli-modules-

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install dependencies
        run: |
          cd extensions/cli
          npm ci --include=optional
          npm run check:install-scripts
          npm run check:dependency-policy

      - name: Build
        run: |
          cd extensions/cli
          npm run build

      - name: Run smoke tests
        run: |
          cd extensions/cli
          npm run test:smoke

      - name: Run tests
        run: |
          cd extensions/cli
          npm test

      # e2e tests are failing on Windows specifically - likely due to stdout flush issues
      - name: Run e2e tests
        if: matrix.os != 'windows-latest'
        run: |
          cd extensions/cli
          npm run test:e2e

      - name: Run Ubuntu CLI-Core runtime functional test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd extensions/cli
          npm run test:runtime-boundary

      - name: Validate CLI release artifact
        run: |
          cd extensions/cli
          npm run check:release-artifact

  smoke-api:
    # Only runs when secrets are available (not on fork PRs)
    needs: changes
    if: needs.changes.outputs.cli_core == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Temporarily non-blocking: failing at Setup steps in CI only, unreproducible
    # locally or via the Ubuntu1 gate. See PR #67 investigation notes.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: "npm"
          cache-dependency-path: extensions/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install dependencies
        run: |
          cd extensions/cli
          npm ci --include=optional
          npm run check:install-scripts
          npm run check:dependency-policy

      - name: Build
        run: |
          cd extensions/cli
          npm run build

      - name: Run smoke API tests
        if: github.actor != 'dependabot[bot]'
        env:
          OCIRCUIT_API_KEY: ${{ secrets.OCIRCUIT_API_KEY }}
        run: |
          cd extensions/cli
          npm run test:smoke-api

  # GitHub does not have a way of requiring that all checks pass (you must manually select each job)
  # This action at least lets us manage the list of required tests via source control
  # so that creators of new jobs can add them to this list
  require-all-checks-to-pass-cli:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - test
      - smoke-api

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          # smoke-api is allowed to skip for fork PRs that lack secrets
          allowed-skips: changes,smoke-api,lint,test
          jobs: ${{ toJSON(needs) }}
