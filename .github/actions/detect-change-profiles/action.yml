name: Detect Change Profiles
description: Classify changed paths into CLI/Core and VSIX validation profiles.
inputs:
  base-sha:
    description: Base revision to compare against.
    required: false
    default: ""
  head-sha:
    description: Head revision to compare.
    required: false
    default: ""
  enable-vsix:
    description: Enable deferred VSIX and VS Code PR validation.
    required: false
    default: "true"
outputs:
  cli_core:
    description: Whether the CLI/Core profile is required.
    value: ${{ steps.classify.outputs.cli_core }}
  vsix:
    description: Whether the VSIX profile is required.
    value: ${{ steps.classify.outputs.vsix }}
runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ENABLE_VSIX: ${{ inputs.enable-vsix }}
      run: |
        set -euo pipefail

        base_sha="${BASE_SHA:-}"
        head_sha="${HEAD_SHA:-$GITHUB_SHA}"
        if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
          base_sha="$(git rev-parse "$head_sha^" 2>/dev/null || true)"
        fi

        if [[ -n "$base_sha" ]]; then
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
        else
          changed_files="$(git show --format= --name-only "$head_sha")"
        fi

        cli_core=false
        vsix=false
        while IFS= read -r file; do
          [[ -z "$file" ]] && continue
          case "$file" in
            packages/sdk/**|.github/workflows/release-sdk.yml)
              cli_core=true
              ;;
            core/**|packages/**)
              cli_core=true
              vsix=true
              ;;
            extensions/cli/**|binary/**|scripts/**|package.json|package-lock.json|.nvmrc|.node-version)
              cli_core=true
              ;;
            extensions/vscode/**|gui/**|.github/actions/build-vscode-extension/**|.github/actions/run-vscode-e2e-test/**|.github/workflows/pr-build-upload-vsix.yaml)
              vsix=true
              ;;
            .github/actions/**|*.lock|**/package-lock.json)
              cli_core=true
              vsix=true
              ;;
            .github/workflows/**)
              cli_core=true
              ;;
          esac
        done <<< "$changed_files"

        if [[ "$ENABLE_VSIX" != "true" ]]; then
          vsix=false
          echo "VSIX profile deferred; VSIX and VS Code PR validation disabled"
        fi

        echo "cli_core=$cli_core" >> "$GITHUB_OUTPUT"
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
        echo "CLI/Core profile required: $cli_core"
        echo "VSIX profile required: $vsix"
